<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%">
  <defs>
    <style>
      .box { fill: #16162A; stroke: rgba(200,184,162,0.35); stroke-width: 1.2; rx: 10; }
      .box-alt { fill: #1E1E32; stroke: rgba(124,111,205,0.55); stroke-width: 1.2; rx: 10; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #F0EDE8; font-weight: 600; }
      .sub { font-family: 'Courier New', monospace; font-size: 11.5px; fill: #C8B8A2; }
      .lbl { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: rgba(240,237,232,0.55); }
      .arrow { stroke: rgba(240,237,232,0.35); stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="rgba(240,237,232,0.5)"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#07070D"/>

  <text x="30" y="34" class="title" font-size="18">Application Architecture</text>
  <text x="30" y="54" class="lbl">React renders views; every color computation lives in a framework-agnostic OOP core.</text>

  <!-- React layer -->
  <rect x="30" y="80" width="940" height="130" class="box"/>
  <text x="50" y="106" class="title">React Presentation Layer</text>
  <text x="50" y="128" class="sub">Hero · PaletteSection · ColorWheelSection · TheorySection · PresetsSection · ExportModal</text>
  <text x="50" y="150" class="lbl">Components read state via usePaletteStore() and useToast(), and render pure output.</text>
  <text x="50" y="172" class="lbl">Canvas heavy views delegate drawing to HeroCanvasRenderer / ColorWheelRenderer classes.</text>
  <text x="50" y="194" class="lbl">No color math or business logic lives inside a component.</text>

  <path d="M500,210 L500,240" class="arrow"/>

  <!-- Core layer -->
  <rect x="30" y="245" width="940" height="200" class="box-alt"/>
  <text x="50" y="271" class="title">Core Domain (framework agnostic TypeScript classes)</text>

  <rect x="50" y="288" width="270" height="135" class="box"/>
  <text x="66" y="310" class="title" font-size="13.5">ColorMath</text>
  <text x="66" y="329" class="lbl">static namespace</text>
  <text x="66" y="349" class="sub">hexToRgb / rgbToHsl</text>
  <text x="66" y="366" class="sub">contrastRatio / wcagLevel</text>
  <text x="66" y="383" class="sub">generateScale / colorName</text>

  <rect x="345" y="288" width="270" height="135" class="box"/>
  <text x="361" y="310" class="title" font-size="13.5">Swatch</text>
  <text x="361" y="329" class="lbl">value object</text>
  <text x="361" y="349" class="sub">.rgb .hsl .cmyk (lazy)</text>
  <text x="361" y="366" class="sub">.contrastWith(other)</text>
  <text x="361" y="383" class="sub">.scale() .readableTextColor</text>

  <rect x="640" y="288" width="300" height="135" class="box"/>
  <text x="656" y="310" class="title" font-size="13.5">HarmonyEngine</text>
  <text x="656" y="329" class="lbl">strategy pattern registry</text>
  <text x="656" y="349" class="sub">Complementary / Analogous</text>
  <text x="656" y="366" class="sub">Triadic / Tetradic / Square</text>
  <text x="656" y="383" class="sub">Monochromatic / Compound</text>

  <path d="M500,445 L500,475" class="arrow"/>

  <!-- State layer -->
  <rect x="30" y="480" width="940" height="60" class="box"/>
  <text x="50" y="505" class="title" font-size="14">PaletteStore &amp; ToastController</text>
  <text x="50" y="525" class="lbl">Observable classes exposed to React through useSyncExternalStore, persisted to localStorage.</text>
</svg>
